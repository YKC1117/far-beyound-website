<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="萬里資訊客戶案例：SFIS 生產現場管控、WMS 出貨與客製化系統整合案例。"><title>客戶案例｜萬里資訊</title><link rel="stylesheet" href="assets/css/app.css"><style>.case-page-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.case-page-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;min-height:220px;display:flex;flex-direction:column;box-shadow:0 12px 38px rgba(15,23,42,.05)}.case-page-card .case-num{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--teal)}.case-page-card h2{font-size:24px;margin:16px 0 4px}.case-page-card h3{font-size:14px;color:#597086;margin:0 0 16px}.case-page-card p{color:var(--muted);font-size:14px;margin:0}.case-page-card .case-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:24px}.case-page-card .case-tags span{font-size:10px;font-weight:800;border-radius:999px;background:#eaf7f5;color:#087a72;padding:5px 9px}@media(max-width:720px){.case-page-grid{grid-template-columns:1fr}}</style></head><body data-page="cases"><div id="siteHeader"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">OUR CASES</span><h1>客戶案例</h1><p>從生產現場管控到倉儲與出貨流程，依實際作業需求整合條碼、設備與系統。</p></div></section><section class="section"><div class="container"><div class="section-head"><div><span class="eyebrow">IMPLEMENTATION EXPERIENCE</span><h2>系統導入實績</h2></div><p>目前先依既有官網公開案例建立新版內容架構；正式上線前可由後台持續新增案例內容與圖片。</p></div><div id="casePageGrid" class="case-page-grid"></div></div></section><section class="cta-band"><div><h2>有類似的現場流程需求？</h2><p>提供目前作業方式與希望改善的問題，我們可協助評估整合方向。</p></div><a class="btn" href="contact.html">洽詢系統整合</a></section></main><div id="siteFooter"></div><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script src="assets/js/pages.js"></script><script src="assets/js/media-patch.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const d=FBStore.getData(),el=document.getElementById('casePageGrid');const desc={'SFIS 生產現場管控系統':'整合現場生產資料、條碼識別與製程資訊，建立生產記錄與追溯入口。','SFIS 現場監控管理系統':'以現場資訊收集與監控為核心，讓生產狀態與作業資訊集中呈現。','冷凍食品出貨系統':'針對倉儲與出貨流程進行客製化整合，協助物料與出貨作業管理。'};el.innerHTML=d.cases.map((c,i)=>`<article class="case-page-card"><span class="case-num">CASE ${String(i+1).padStart(2,'0')}</span><h2>${c.name}</h2><h3>${c.system}</h3><p>${desc[c.system]||'依客戶現場需求進行系統與條碼設備整合。'}</p><div class="case-tags"><span>條碼整合</span><span>現場系統</span><span>客製流程</span></div></article>`).join('')})</script><script src="assets/js/nav-menu.js"></script></body></html>
