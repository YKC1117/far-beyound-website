name: Verify enhanced navigation wiring

on:
  push:
    paths:
      - '*.html'
      - 'assets/js/nav-menu.js'
      - 'assets/js/presentation-polish.js'
      - 'assets/js/final-fixes.js'
      - 'assets/js/v2-corporate.js'
      - 'assets/js/v4-polish.js'
      - 'assets/js/v5-showcase.js'
      - 'assets/js/interaction-upgrade.js'
      - 'assets/js/product-docs.js'
      - 'assets/js/product-resources.js'
      - 'assets/js/site-social.js'
      - 'assets/js/contact-youtube-upgrade.js'
      - 'assets/js/desktop-phone-popover.js'
      - 'assets/css/v2-corporate.css'
      - 'assets/css/v4-polish.css'
      - 'assets/css/v4-inner-polish.css'
      - 'assets/css/v5-showcase.css'
      - '.github/workflows/inject-nav-menu.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public presentation wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          required_css = [
              'assets/css/v2-corporate.css',
              'assets/css/v4-polish.css',
              'assets/css/v4-inner-polish.css',
              'assets/css/v5-showcase.css',
          ]
          required_js = [
              'assets/js/nav-menu.js',
              'assets/js/presentation-polish.js',
              'assets/js/final-fixes.js',
              'assets/js/v2-corporate.js',
              'assets/js/v4-polish.js',
              'assets/js/v5-showcase.js',
              'assets/js/interaction-upgrade.js',
              'assets/js/product-docs.js',
              'assets/js/site-social.js',
              'assets/js/product-resources.js',
          ]
          versioned_js = [
              'assets/js/contact-youtube-upgrade.js',
              'assets/js/desktop-phone-popover.js',
          ]

          failures = []
          checked = 0
          for p in sorted(Path('.').glob('*.html')):
              if p.name == 'admin.html':
                  continue
              text = p.read_text(encoding='utf-8')
              if 'assets/js/app.js' not in text:
                  continue
              checked += 1
              for asset in required_css + required_js:
                  if asset not in text:
                      failures.append(f'{p.name}: missing {asset}')
              for asset in versioned_js:
                  if not re.search(re.escape(asset) + r'(?:\?v=[^"\']*)?', text):
                      failures.append(f'{p.name}: missing {asset}')
              if 'rel="icon"' not in text:
                  failures.append(f'{p.name}: missing favicon')

          print(f'PUBLIC_PAGES_CHECKED={checked}')
          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          print('PUBLIC_PRESENTATION_WIRING=OK')
          PY
