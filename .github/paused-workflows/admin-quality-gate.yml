name: Admin quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  admin-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static admin readiness audit
        run: python3 tools/audit_admin_readiness.py

      - name: JavaScript syntax audit
        run: |
          set -e
          for f in assets/js/admin-*.js assets/js/cloud-sync.js assets/js/front-feature-control.js assets/js/media-patch.js; do
            node --check "$f"
          done

      - name: Start local preview
        run: |
          python3 -m http.server 8080 >/tmp/farbeyound-admin-http.log 2>&1 &
          sleep 2

      - name: Render admin and verify dynamic modules
        run: |
          set -e
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          mkdir -p qa-admin
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8080/admin.html > qa-admin/admin-rendered.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=7000 --screenshot=qa-admin/admin-desktop.png http://127.0.0.1:8080/admin.html
          pip install --disable-pip-version-check beautifulsoup4 >/dev/null
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          import json

          html=Path('qa-admin/admin-rendered.html').read_text(encoding='utf-8')
          soup=BeautifulSoup(html,'html.parser')

          required=[
              'adminDashboard','adminSelfCheck','adminSeoCenter','adminSecurityCenter',
              'adminBackupCenter','adminTransitionSecurityNote','adminFrontFeatureManager',
              'adminBrandManager','adminLocationManager','adminPassword','adminPasswordForm',
              'inquiryExportCsv','adminProductExportCsv','adminProductExportSelectedCsv'
          ]
          missing=[x for x in required if not soup.find(id=x)]
          ids=[x.get('id') for x in soup.find_all(id=True)]
          dup=sorted({x for x in ids if ids.count(x)>1})
          form=soup.find(id='adminPasswordForm')
          inquiry_export=soup.find(id='inquiryExportCsv')
          product_export=soup.find(id='adminProductExportCsv')
          selected_export=soup.find(id='adminProductExportSelectedCsv')
          text=soup.get_text(' ',strip=True)
          report={
              'required':required,
              'missing':missing,
              'duplicate_ids':dup[:50],
              'password_form_exists':form is not None,
              'password_form_hidden':bool(form and form.has_attr('hidden')),
              'shared_password_copy':'共用發布密碼' in text,
              'transition_copy':'尚未正式啟用 Owner／個人帳號／2FA' in text,
              'inquiry_csv_export_exists':inquiry_export is not None,
              'product_csv_export_exists':product_export is not None,
              'selected_product_csv_export_exists':selected_export is not None,
              'selected_product_csv_export_initially_disabled':bool(selected_export and selected_export.has_attr('disabled')),
              'rendered_id_count':len(ids),
          }
          Path('qa-admin/admin-diagnostics.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))

          assert not missing, f'Missing rendered admin modules: {missing}'
          assert not dup, f'Duplicate DOM ids: {dup[:20]}'
          assert form is not None, 'Shared-password management form missing'
          assert not form.has_attr('hidden'), 'Shared-password management form must stay available in transition mode'
          assert report['shared_password_copy'], 'Shared-password transition copy missing'
          assert report['transition_copy'], 'Transition-mode explanation missing'
          assert inquiry_export is not None, 'Inquiry CSV export tool did not load'
          assert product_export is not None, 'Product CSV export tool did not load'
          assert selected_export is not None, 'Selected-product CSV export tool did not load'
          assert selected_export.has_attr('disabled'), 'Selected-product CSV export must be disabled before a product is selected'

          print('ADMIN_DYNAMIC_MODULES=PASS')
          print('ADMIN_SHARED_PASSWORD_UI=PASS')
          print('ADMIN_CSV_EXPORT_TOOLS=PASS')
          print('ADMIN_SELECTED_PRODUCT_EXPORT=PASS')
          PY

      - name: Capture and verify mobile admin
        if: always()
        run: |
          set -e
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          if [ -n "$CHROME" ]; then
            mkdir -p qa-admin
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8080/admin.html > qa-admin/admin-mobile-rendered.html
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=7000 --screenshot=qa-admin/admin-mobile.png http://127.0.0.1:8080/admin.html
            pip install --disable-pip-version-check beautifulsoup4 >/dev/null
            python3 - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          import json

          html=Path('qa-admin/admin-mobile-rendered.html').read_text(encoding='utf-8')
          soup=BeautifulSoup(html,'html.parser')
          body=soup.body
          required_mobile=[
              'amcMobileBar','amcMobileMenu','amcMobileTitle','amcMobileBackdrop','adminMobileNav',
              'inquiryExportCsv','adminProductExportCsv','adminProductExportSelectedCsv'
          ]
          missing=[x for x in required_mobile if not soup.find(id=x)]
          classes=set(body.get('class',[])) if body else set()
          report={
              'required_mobile':required_mobile,
              'missing_mobile':missing,
              'mobile_mode_class':'admin-mobile-cms' in classes,
              'menu_expanded':(soup.find(id='amcMobileMenu') or {}).get('aria-expanded'),
              'inquiry_csv_export_exists':soup.find(id='inquiryExportCsv') is not None,
              'product_csv_export_exists':soup.find(id='adminProductExportCsv') is not None,
              'selected_product_csv_export_exists':soup.find(id='adminProductExportSelectedCsv') is not None,
          }
          Path('qa-admin/admin-mobile-diagnostics.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert not missing, f'Missing mobile admin chrome/tools: {missing}'
          assert report['mobile_mode_class'], 'Mobile admin mode class was not activated at 390px'
          print('ADMIN_MOBILE_CHROME=PASS')
          print('ADMIN_MOBILE_CSV_EXPORT_TOOLS=PASS')
          PY
          fi
          cp /tmp/farbeyound-admin-http.log qa-admin/http.log 2>/dev/null || true

      - name: Verify admin desktop and mobile horizontal overflow
        run: |
          pip install --disable-pip-version-check selenium >/dev/null
          python3 - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          viewports = {
              'desktop': (1440, 1200),
              'mobile': (390, 844),
          }
          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-gpu')
          options.add_argument('--hide-scrollbars')
          driver = webdriver.Chrome(options=options)
          failures=[]
          try:
              for mode,(width,height) in viewports.items():
                  driver.set_window_size(width,height)
                  driver.get('http://127.0.0.1:8080/admin.html')
                  time.sleep(2.2)
                  sizes=driver.execute_script('''
                      const de=document.documentElement;
                      const body=document.body;
                      return {
                        client:de.clientWidth,
                        inner:window.innerWidth,
                        scroll:Math.max(de.scrollWidth,body?body.scrollWidth:0)
                      };
                  ''')
                  overflow=max(0,int(sizes['scroll'])-int(sizes['client']))
                  mobile_mode=driver.execute_script("return document.body.classList.contains('admin-mobile-cms')")
                  mobile_bar=driver.execute_script("return !!document.getElementById('amcMobileBar')")
                  print(f'{mode.upper()} client={sizes["client"]} scroll={sizes["scroll"]} overflow={overflow} mobile_mode={mobile_mode} mobile_bar={mobile_bar}')
                  if mode=='mobile' and (not mobile_mode or not mobile_bar):
                      failures.append((mode,'mobile chrome inactive',sizes,[]))
                  if mode=='desktop' and mobile_mode:
                      failures.append((mode,'mobile class active on desktop',sizes,[]))
                  if overflow>2:
                      culprits=driver.execute_script('''
                          const limit=document.documentElement.clientWidth+2;
                          return Array.from(document.querySelectorAll('body *'))
                            .map(el=>{
                              const r=el.getBoundingClientRect();
                              return {tag:el.tagName,id:el.id||'',cls:String(el.className||'').slice(0,80),right:Math.round(r.right),width:Math.round(r.width)};
                            })
                            .filter(x=>x.right>limit&&x.width>0)
                            .slice(0,15);
                      ''')
                      failures.append((mode,'horizontal overflow',sizes,culprits))
          finally:
              driver.quit()

          if failures:
              for mode,reason,sizes,culprits in failures:
                  print(f'ADMIN_RESPONSIVE_FAIL {mode}: {reason}; {sizes}; culprits={culprits}')
              raise SystemExit(f'Admin responsive QA failed: {len(failures)} issue(s)')

          print('ADMIN_RESPONSIVE_OVERFLOW=PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-quality-gate
          path: qa-admin/
          retention-days: 3
