name: Public release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax audit
        run: |
          node --check assets/js/public-release-polish.js
          node --check assets/js/pages.js
          node --check assets/js/data.js
          node --check assets/js/news-archive-runtime.js
          node --check assets/js/solution-coverage.js
          node --check assets/js/case-category-runtime.js
          node --check assets/js/product-route-guard.js

      - name: Public source integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          pages = Path('assets/js/pages.js').read_text(encoding='utf-8')
          if 'demo-news' in pages:
              raise SystemExit('assets/js/pages.js still contains demo-news')
          if 'function newsHref(n)' not in pages:
              raise SystemExit('assets/js/pages.js is missing the real news link resolver')

          data = Path('assets/js/data.js').read_text(encoding='utf-8')
          forbidden_source = [
              '正式版將連接公司檔案空間',
              '正式版可由後台上傳',
              '測試環境尚未掛載正式檔案',
              '新聞內頁將於完整資料搬移階段接入',
          ]
          source_hits=[x for x in forbidden_source if x in data]
          if source_hits:
              raise SystemExit('Customer-facing development copy remains in assets/js/data.js: '+', '.join(source_hits))

          legacy=Path('assets/js/legacy-news.js').read_text(encoding='utf-8').strip()
          prefix='window.FBLegacyNews='
          if not legacy.startswith(prefix) or not legacy.endswith(';'):
              raise SystemExit('Invalid legacy news archive wrapper')
          archive=json.loads(legacy[len(prefix):-1])
          items=archive.get('items') or []
          if len(items)!=25:
              raise SystemExit(f'Expected 25 migrated news articles, found {len(items)}')
          if 'far-beyound.com.tw' in legacy.lower() or any('legacyUrl' in x for x in items):
              raise SystemExit('Public news archive still depends on the legacy hostname')
          if not all(str(x.get('legacyPath') or '').startswith('/news/') for x in items):
              raise SystemExit('Legacy news archive contains an invalid migration path')

          bump=Path('tools/bump_public_release.py').read_text(encoding='utf-8')
          match=re.search(r'VERSION\s*=\s*["\']([^"\']+)',bump)
          if not match:
              raise SystemExit('Cannot resolve public release cache version')
          version=match.group(1)
          expected=f'assets/js/site-social.js?v={version}'
          required=['index.html','about.html','cases.html','downloads.html','news.html','news-detail.html','product.html','solutions.html']
          bad=[]
          for name in required:
              text=Path(name).read_text(encoding='utf-8')
              if expected not in text:
                  bad.append(name)
          if bad:
              raise SystemExit(f'Public loader cache version {version} is stale: '+', '.join(bad))
          print(f'PUBLIC_SOURCE_INTEGRITY=PASS version={version}')
          PY

      - name: Start local preview
        run: |
          python3 -m http.server 8080 >/tmp/farbeyound-public-http.log 2>&1 &
          sleep 2

      - name: Render public pages and reject development copy
        shell: bash
        run: |
          set -e
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          mkdir -p qa-public
          pages=(
            "index.html"
            "products.html"
            "product.html?id=zebra-zt411-zt421"
            "downloads.html"
            "news.html"
            "news-detail.html?id=material-price"
            "news-detail.html?id=printer-share-error"
            "solutions.html"
            "cases.html"
            "cases.html?system=sfis"
            "cases.html?system=wms"
            "cases.html?system=smt"
            "cases.html?system=barcode"
            "about.html"
            "locations.html"
            "contact.html"
          )
          i=0
          for page in "${pages[@]}"; do
            i=$((i+1))
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=8000 --dump-dom "http://127.0.0.1:8080/$page" > "qa-public/page-$i.html"
          done
          python3 - <<'PY'
          from pathlib import Path
          from html import unescape
          from html.parser import HTMLParser
          import re

          banned=[
              '測試版',
              '測試環境',
              '正式檔案空間尚未接入',
              '新聞內頁將於完整資料搬移階段接入',
              '正式版可由後台上傳',
              '正式版將連接公司檔案空間',
              '可透過管理介面新增產品資料',
          ]
          failures=[]
          demo_class=re.compile(r'class\s*=\s*(["\'])[^"\']*\bdemo-(?:download|news)\b[^"\']*\1', re.I)
          for path in sorted(Path('qa-public').glob('page-*.html')):
              raw=path.read_text(encoding='utf-8',errors='replace')
              rendered=re.sub(r'<script\b[^>]*>.*?</script>', '', raw, flags=re.I|re.S)
              rendered=re.sub(r'<style\b[^>]*>.*?</style>', '', rendered, flags=re.I|re.S)
              if demo_class.search(rendered):
                  failures.append(f'{path.name}: unresolved demo control remains in rendered DOM')
              visible=unescape(re.sub(r'<[^>]+>', ' ', rendered))
              visible=re.sub(r'\s+', ' ', visible)
              for phrase in banned:
                  if phrase in visible:
                      failures.append(f'{path.name}: {phrase}')

          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.news_cards=0
                  self.case_systems=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  classes=set((a.get('class') or '').split())
                  if 'news-card' in classes:
                      self.news_cards+=1
                  if 'case-page-card' in classes:
                      self.case_systems.append(a.get('data-system') or '')

          def probe(raw):
              p=Probe();p.feed(raw);return p

          news=Path('qa-public/page-5.html').read_text(encoding='utf-8',errors='replace')
          history=Path('qa-public/page-7.html').read_text(encoding='utf-8',errors='replace')
          solutions=Path('qa-public/page-8.html').read_text(encoding='utf-8',errors='replace')
          all_cases=Path('qa-public/page-9.html').read_text(encoding='utf-8',errors='replace')
          sfis=Path('qa-public/page-10.html').read_text(encoding='utf-8',errors='replace')
          wms=Path('qa-public/page-11.html').read_text(encoding='utf-8',errors='replace')
          smt=Path('qa-public/page-12.html').read_text(encoding='utf-8',errors='replace')
          barcode=Path('qa-public/page-13.html').read_text(encoding='utf-8',errors='replace')

          news_cards=probe(news).news_cards
          if '2025年農曆春節休假公告' not in news or news_cards < 20:
              failures.append(f'news.html: migrated history is not stable after later renderers (cards={news_cards})')
          if '共用印表機' not in history or '歷史資訊提醒' not in history:
              failures.append('historical technical news detail: title or history notice is missing')
          if 'id="barcode"' not in solutions or '條碼整合系統' not in solutions:
              failures.append('solutions.html: barcode integration solution is missing')

          def systems(raw): return probe(raw).case_systems
          def card_count(raw): return len(systems(raw))
          if card_count(all_cases) < 4 or '全部案例' not in all_cases:
              failures.append(f'cases.html: all-case view incomplete (cards={card_count(all_cases)})')
          if card_count(sfis) < 3 or any(x!='sfis' for x in systems(sfis)) or 'SFIS 客戶案例' not in sfis:
              failures.append(f'cases.html?system=sfis: filter mismatch (cards={card_count(sfis)}, systems={systems(sfis)})')
          if card_count(wms) < 1 or any(x!='wms' for x in systems(wms)) or 'WMS 客戶案例' not in wms:
              failures.append(f'cases.html?system=wms: filter mismatch (cards={card_count(wms)}, systems={systems(wms)})')
          for title,raw,key in [('SMT 客戶案例',smt,'smt'),('條碼整合客戶案例',barcode,'barcode')]:
              found=systems(raw)
              if found and any(x!=key for x in found):
                  failures.append(f'cases.html?system={key}: unrelated case leaked into filtered view: {found}')
              if not found and '目前未公開此分類案例' not in raw:
                  failures.append(f'cases.html?system={key}: missing honest empty state')
              if title not in raw:
                  failures.append(f'cases.html?system={key}: category heading missing')

          if failures:
              raise SystemExit('PUBLIC RELEASE GATE FAILED\n'+'\n'.join(failures))
          print('PUBLIC_RELEASE_COPY=PASS')
          print(f'LEGACY_NEWS_RENDER=PASS cards={news_cards}')
          print('HISTORICAL_TECH_NOTICE=PASS')
          print('BARCODE_SOLUTION_RENDER=PASS')
          print(f'CASE_FILTER_RENDER=PASS all={card_count(all_cases)} sfis={card_count(sfis)} wms={card_count(wms)} smt={card_count(smt)} barcode={card_count(barcode)}')
          PY

      - name: Capture representative public screenshots
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=8000 --screenshot=qa-public/home-desktop.png http://127.0.0.1:8080/index.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=8000 --screenshot=qa-public/home-mobile.png http://127.0.0.1:8080/index.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=8000 --screenshot=qa-public/product-desktop.png 'http://127.0.0.1:8080/product.html?id=zebra-zt411-zt421'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1400 --virtual-time-budget=8000 --screenshot=qa-public/solutions-desktop.png 'http://127.0.0.1:8080/solutions.html#barcode'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1400 --virtual-time-budget=8000 --screenshot=qa-public/cases-sfis-desktop.png 'http://127.0.0.1:8080/cases.html?system=sfis'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-release-gate
          path: qa-public/
          retention-days: 3
