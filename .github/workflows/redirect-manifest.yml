name: Redirect manifest

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/legacy-catalog.js'
      - 'assets/js/legacy-downloads.js'
      - 'assets/js/legacy-news.js'
      - 'migration/manual-redirects.csv'
      - 'tools/product_public_ids.py'
      - 'tools/build_redirect_manifest_v2.py'
      - '.github/workflows/redirect-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redirects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build redirect manifest V2
        run: python3 tools/build_redirect_manifest_v2.py
      - name: Validate generated manifest and coverage
        run: |
          python3 - <<'PY'
          import csv,json,re
          from pathlib import Path
          p=Path('migration/generated/redirects.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig')))
          assert rows, 'redirect manifest is empty'
          assert len({r['source'] for r in rows})==len(rows), 'duplicate redirect source'
          assert all(r['status']=='301' for r in rows), 'non-301 redirect found'
          assert all(r['source'].startswith('/') and r['target'].startswith('/') for r in rows), 'invalid path'
          assert not any(r['source']==r['target'] for r in rows), 'redirect loop found'
          assert not any('far-beyound.com.tw' in r['source'].lower() or 'far-beyound.com.tw' in r['target'].lower() for r in rows), 'manifest must store paths, not host dependencies'
          summary=json.loads(Path('migration/generated/summary.json').read_text(encoding='utf-8'))
          assert summary['counts'].get('product',0)==150, 'product redirect coverage changed unexpectedly'
          assert summary['counts'].get('product-category',0)==9, 'missing product root/category/software redirects'
          assert summary['counts'].get('download',0)>0, 'missing download redirects'
          assert summary['counts'].get('news',0)==summary.get('news_imported'), 'legacy news coverage is incomplete'
          assert summary.get('news_covered')==summary.get('news_imported'), 'legacy news coverage mismatch'
          assert summary['counts'].get('news-category',0)==4, 'missing news root/category redirects'
          assert summary['counts'].get('system',0)==8, 'missing system solution redirects'
          assert summary['counts'].get('case',0)==5, 'missing case redirects'
          assert summary.get('product_url_rule')=='brand-model-canonical', 'wrong product URL rule'

          product_rows=[r for r in rows if r['kind']=='product']
          assert all(r['target'].startswith('/product.html?id=') for r in product_rows), 'invalid product target format'
          assert not any('id=legacy-' in r['target'] for r in product_rows), 'legacy product id exposed in public redirect target'
          product_map={r['source']:r['target'] for r in product_rows}
          expected_products={
              '/product/1/5/11/6':'/product.html?id=zebra-zt610-zt620',
              '/product/1/5/12/5':'/product.html?id=zebra-zt411-zt421',
              '/product/1/22/33/184':'/product.html?id=tsc-th240-th340',
          }
          for source,target in expected_products.items():
              assert product_map.get(source)==target, f'brand+model redirect mismatch: {source} -> {product_map.get(source)}'

          expected_product_categories={
              '/product':'/products.html',
              '/product/1':'/products.html?category=printers',
              '/product/2':'/products.html?category=scanners',
              '/product/3':'/products.html?category=rfid',
              '/product/4':'/products.html?category=mobile',
              '/product/16':'/products.html?category=labels',
              '/product/20':'/products.html?category=printing',
              '/product/65':'/products.html?category=parts',
              '/product/automation/bzj.asp':'/products.html?category=software',
          }
          actual_product_categories={r['source']:r['target'] for r in rows if r['kind']=='product-category'}
          assert actual_product_categories==expected_product_categories, f'product category redirect mismatch: {actual_product_categories}'

          sources={r['source'] for r in rows}
          for required in ['/news','/news/1','/news/2','/news/3','/system','/system/2','/system/2/5','/system/3','/system/3/6','/system/4','/system/4/7','/system/6','/case','/case/5','/case/6','/case/7','/case/11',*expected_product_categories.keys()]:
              assert required in sources, f'missing required redirect: {required}'
          news_rows=[r for r in rows if r['kind']=='news']
          assert news_rows and all(re.fullmatch(r'/news/\d+/\d+',r['source']) for r in news_rows), 'invalid news article source path'
          assert all(r['target'].startswith('/news-detail.html?id=') for r in news_rows), 'news article must redirect to exact detail page'
          expected_system={
              '/system':'/solutions.html',
              '/system/2':'/solutions.html#sfis',
              '/system/2/5':'/solutions.html#sfis',
              '/system/3':'/solutions.html#wms',
              '/system/3/6':'/solutions.html#wms',
              '/system/4':'/solutions.html#smt',
              '/system/4/7':'/solutions.html#smt',
              '/system/6':'/solutions.html#barcode',
          }
          actual_system={r['source']:r['target'] for r in rows if r['kind']=='system'}
          assert actual_system==expected_system, f'system redirect mismatch: {actual_system}'
          expected_case={
              '/case':'/cases.html',
              '/case/5':'/cases.html?system=sfis',
              '/case/6':'/cases.html?system=wms',
              '/case/7':'/cases.html?system=smt',
              '/case/11':'/cases.html?system=barcode',
          }
          actual_case={r['source']:r['target'] for r in rows if r['kind']=='case'}
          assert actual_case==expected_case, f'case redirect mismatch: {actual_case}'
          print(summary)
          print('PRODUCT_CANONICAL_URLS=PASS')
          print('PRODUCT_CATEGORY_REDIRECTS=PASS')
          print('REDIRECT_COVERAGE=PASS')
          PY
      - name: Upload redirect package
        uses: actions/upload-artifact@v4
        with:
          name: far-beyound-redirect-package
          path: migration/generated/
          retention-days: 30
