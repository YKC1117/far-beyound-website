name: Public release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax audit
        run: |
          node --check assets/js/public-release-polish.js
          node --check assets/js/pages.js
          node --check assets/js/data.js
          node --check assets/js/news-archive-runtime.js
          node --check assets/js/solution-coverage.js

      - name: Public source integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          pages = Path('assets/js/pages.js').read_text(encoding='utf-8')
          if 'demo-news' in pages:
              raise SystemExit('assets/js/pages.js still contains demo-news')
          if 'function newsHref(n)' not in pages:
              raise SystemExit('assets/js/pages.js is missing the real news link resolver')

          data = Path('assets/js/data.js').read_text(encoding='utf-8')
          forbidden_source = [
              '正式版將連接公司檔案空間',
              '正式版可由後台上傳',
              '測試環境尚未掛載正式檔案',
              '新聞內頁將於完整資料搬移階段接入',
          ]
          source_hits=[x for x in forbidden_source if x in data]
          if source_hits:
              raise SystemExit('Customer-facing development copy remains in assets/js/data.js: '+', '.join(source_hits))

          legacy=Path('assets/js/legacy-news.js').read_text(encoding='utf-8').strip()
          prefix='window.FBLegacyNews='
          if not legacy.startswith(prefix) or not legacy.endswith(';'):
              raise SystemExit('Invalid legacy news archive wrapper')
          archive=json.loads(legacy[len(prefix):-1])
          items=archive.get('items') or []
          if len(items)!=25:
              raise SystemExit(f'Expected 25 migrated news articles, found {len(items)}')
          if 'far-beyound.com.tw' in legacy.lower() or any('legacyUrl' in x for x in items):
              raise SystemExit('Public news archive still depends on the legacy hostname')
          if not all(str(x.get('legacyPath') or '').startswith('/news/') for x in items):
              raise SystemExit('Legacy news archive contains an invalid migration path')

          expected='assets/js/site-social.js?v=20260912-1956'
          required=['index.html','about.html','cases.html','downloads.html','news.html','news-detail.html','product.html','solutions.html']
          bad=[]
          for name in required:
              text=Path(name).read_text(encoding='utf-8')
              if expected not in text:
                  bad.append(name)
          if bad:
              raise SystemExit('Public loader cache version is stale: '+', '.join(bad))
          print('PUBLIC_SOURCE_INTEGRITY=PASS')
          PY

      - name: Start local preview
        run: |
          python3 -m http.server 8080 >/tmp/farbeyound-public-http.log 2>&1 &
          sleep 2

      - name: Render public pages and reject development copy
        shell: bash
        run: |
          set -e
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          mkdir -p qa-public
          pages=(
            "index.html"
            "products.html"
            "product.html?id=zebra-zt411-zt421"
            "downloads.html"
            "news.html"
            "news-detail.html?id=material-price"
            "news-detail.html?id=legacy-news-3-24"
            "solutions.html"
            "cases.html"
            "about.html"
            "locations.html"
            "contact.html"
          )
          i=0
          for page in "${pages[@]}"; do
            i=$((i+1))
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=8000 --dump-dom "http://127.0.0.1:8080/$page" > "qa-public/page-$i.html"
          done
          python3 - <<'PY'
          from pathlib import Path
          from html import unescape
          import re

          banned=[
              '測試版',
              '測試環境',
              '正式檔案空間尚未接入',
              '新聞內頁將於完整資料搬移階段接入',
              '正式版可由後台上傳',
              '正式版將連接公司檔案空間',
              '可透過管理介面新增產品資料',
          ]
          failures=[]
          demo_class=re.compile(r'class\s*=\s*(["\'])[^"\']*\bdemo-(?:download|news)\b[^"\']*\1', re.I)
          for path in sorted(Path('qa-public').glob('page-*.html')):
              raw=path.read_text(encoding='utf-8',errors='replace')
              rendered=re.sub(r'<script\b[^>]*>.*?</script>', '', raw, flags=re.I|re.S)
              rendered=re.sub(r'<style\b[^>]*>.*?</style>', '', rendered, flags=re.I|re.S)
              if demo_class.search(rendered):
                  failures.append(f'{path.name}: unresolved demo control remains in rendered DOM')
              visible=unescape(re.sub(r'<[^>]+>', ' ', rendered))
              visible=re.sub(r'\s+', ' ', visible)
              for phrase in banned:
                  if phrase in visible:
                      failures.append(f'{path.name}: {phrase}')

          news=Path('qa-public/page-5.html').read_text(encoding='utf-8',errors='replace')
          history=Path('qa-public/page-7.html').read_text(encoding='utf-8',errors='replace')
          solutions=Path('qa-public/page-8.html').read_text(encoding='utf-8',errors='replace')
          if '2025年農曆春節休假公告' not in news:
              failures.append('news.html: migrated history is not rendered')
          if '2025年農曆春節休假公告' not in history or '歷史資訊提醒' not in history:
              failures.append('historical news detail: title or history notice is missing')
          if 'id="barcode"' not in solutions or '條碼整合系統' not in solutions:
              failures.append('solutions.html: barcode integration solution is missing')

          if failures:
              raise SystemExit('PUBLIC RELEASE GATE FAILED\n'+'\n'.join(failures))
          print('PUBLIC_RELEASE_COPY=PASS')
          print('LEGACY_NEWS_RENDER=PASS')
          print('BARCODE_SOLUTION_RENDER=PASS')
          PY

      - name: Capture representative public screenshots
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=8000 --screenshot=qa-public/home-desktop.png http://127.0.0.1:8080/index.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=8000 --screenshot=qa-public/home-mobile.png http://127.0.0.1:8080/index.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=8000 --screenshot=qa-public/product-desktop.png 'http://127.0.0.1:8080/product.html?id=zebra-zt411-zt421'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1400 --virtual-time-budget=8000 --screenshot=qa-public/solutions-desktop.png 'http://127.0.0.1:8080/solutions.html#barcode'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-release-gate
          path: qa-public/
          retention-days: 3
