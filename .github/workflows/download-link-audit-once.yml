name: Download link audit once

on:
  push:
    branches:
      - qa/download-link-audit-20260917

jobs:
  audit-download-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe legacy download URLs
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, pathlib, urllib.request, urllib.error, socket

          text = pathlib.Path('assets/js/legacy-downloads.js').read_text(encoding='utf-8').strip()
          prefix = 'window.FBLegacyDownloads='
          if not text.startswith(prefix):
              raise SystemExit('unexpected legacy-downloads.js format')
          payload = text[len(prefix):]
          if payload.endswith(';'):
              payload = payload[:-1]
          rows = json.loads(payload).get('downloads', [])
          print(f'TOTAL={len(rows)}')

          def probe(pair):
              i, item = pair
              url = str(item.get('url') or '').strip()
              name = str(item.get('name') or '')
              brand = str(item.get('brand') or '')
              if not url:
                  return ('UNCERTAIN', i, brand, name, 'EMPTY', url)
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 FarBeyound-Link-Audit/1.0',
                  'Range': 'bytes=0-0',
                  'Accept': '*/*',
              })
              try:
                  with urllib.request.urlopen(req, timeout=12) as resp:
                      code = getattr(resp, 'status', 200)
                      final = resp.geturl()
                      resp.read(1)
                  return ('OK' if 200 <= code < 400 else 'UNCERTAIN', i, brand, name, code, final)
              except urllib.error.HTTPError as exc:
                  status = 'BROKEN' if exc.code in (404, 410) else 'UNCERTAIN'
                  return (status, i, brand, name, exc.code, url)
              except (urllib.error.URLError, socket.timeout, TimeoutError, Exception) as exc:
                  return ('UNCERTAIN', i, brand, name, type(exc).__name__, url)

          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              results = list(pool.map(probe, enumerate(rows, 1)))
          results.sort(key=lambda row: row[1])
          for row in results:
              print('\t'.join(map(str, row)))
          counts = {key: sum(1 for row in results if row[0] == key) for key in ('OK','BROKEN','UNCERTAIN')}
          print(f"SUMMARY OK={counts['OK']} BROKEN={counts['BROKEN']} UNCERTAIN={counts['UNCERTAIN']}")
          broken = [row for row in results if row[0] == 'BROKEN']
          if broken:
              print('DEFINITE_BROKEN_BEGIN')
              for row in broken:
                  print('\t'.join(map(str, row[2:])))
              print('DEFINITE_BROKEN_END')
          PY
