name: Download link audit once

on:
  push:
    branches:
      - qa/download-link-audit-20260917

jobs:
  audit-download-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe legacy download URLs
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.error, socket

          text = pathlib.Path('assets/js/legacy-downloads.js').read_text(encoding='utf-8').strip()
          prefix = 'window.FBLegacyDownloads='
          if not text.startswith(prefix):
              raise SystemExit('unexpected legacy-downloads.js format')
          payload = text[len(prefix):]
          if payload.endswith(';'):
              payload = payload[:-1]
          data = json.loads(payload)
          rows = data.get('downloads', [])
          print(f'TOTAL={len(rows)}')
          broken = []
          uncertain = []
          ok = []
          for i, item in enumerate(rows, 1):
              url = str(item.get('url') or '').strip()
              name = str(item.get('name') or '')
              brand = str(item.get('brand') or '')
              if not url:
                  uncertain.append((brand, name, 'EMPTY', url))
                  print(f'UNCERTAIN\t{i}\t{brand}\t{name}\tEMPTY\t{url}')
                  continue
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 FarBeyound-Link-Audit/1.0',
                  'Range': 'bytes=0-0',
                  'Accept': '*/*',
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      code = getattr(resp, 'status', 200)
                      final = resp.geturl()
                      resp.read(1)
                  if 200 <= code < 400:
                      ok.append((brand, name, code, final))
                      print(f'OK\t{i}\t{brand}\t{name}\t{code}\t{final}')
                  else:
                      uncertain.append((brand, name, code, final))
                      print(f'UNCERTAIN\t{i}\t{brand}\t{name}\t{code}\t{final}')
              except urllib.error.HTTPError as exc:
                  code = exc.code
                  if code in (404, 410):
                      broken.append((brand, name, code, url))
                      print(f'BROKEN\t{i}\t{brand}\t{name}\t{code}\t{url}')
                  else:
                      uncertain.append((brand, name, code, url))
                      print(f'UNCERTAIN\t{i}\t{brand}\t{name}\t{code}\t{url}')
              except (urllib.error.URLError, socket.timeout, TimeoutError, Exception) as exc:
                  uncertain.append((brand, name, type(exc).__name__, url))
                  print(f'UNCERTAIN\t{i}\t{brand}\t{name}\t{type(exc).__name__}\t{url}')

          print(f'SUMMARY OK={len(ok)} BROKEN={len(broken)} UNCERTAIN={len(uncertain)}')
          if broken:
              print('DEFINITE_BROKEN_BEGIN')
              for row in broken:
                  print('\t'.join(map(str, row)))
              print('DEFINITE_BROKEN_END')
          PY
