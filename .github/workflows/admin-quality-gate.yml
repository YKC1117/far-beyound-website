name: Admin quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  admin-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static admin readiness audit
        run: python3 tools/audit_admin_readiness.py

      - name: JavaScript syntax audit
        run: |
          set -e
          for f in assets/js/admin-*.js assets/js/cloud-sync.js assets/js/front-feature-control.js assets/js/media-patch.js; do
            node --check "$f"
          done

      - name: Start local preview
        run: |
          python3 -m http.server 8080 >/tmp/farbeyound-admin-http.log 2>&1 &
          sleep 2

      - name: Render admin and verify dynamic modules
        run: |
          set -e
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          mkdir -p qa-admin
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8080/admin.html > qa-admin/admin-rendered.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=7000 --screenshot=qa-admin/admin-desktop.png http://127.0.0.1:8080/admin.html
          pip install --disable-pip-version-check beautifulsoup4 >/dev/null
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          import json

          html=Path('qa-admin/admin-rendered.html').read_text(encoding='utf-8')
          soup=BeautifulSoup(html,'html.parser')

          required=[
              'adminDashboard','adminSelfCheck','adminSeoCenter','adminSecurityCenter',
              'adminBackupCenter','adminTransitionSecurityNote','adminFrontFeatureManager',
              'adminBrandManager','adminLocationManager','adminPassword','adminPasswordForm'
          ]
          missing=[x for x in required if not soup.find(id=x)]
          ids=[x.get('id') for x in soup.find_all(id=True)]
          dup=sorted({x for x in ids if ids.count(x)>1})
          form=soup.find(id='adminPasswordForm')
          text=soup.get_text(' ',strip=True)
          report={
              'required':required,
              'missing':missing,
              'duplicate_ids':dup[:50],
              'password_form_exists':form is not None,
              'password_form_hidden':bool(form and form.has_attr('hidden')),
              'shared_password_copy':'共用發布密碼' in text,
              'transition_copy':'尚未正式啟用 Owner／個人帳號／2FA' in text,
              'rendered_id_count':len(ids),
          }
          Path('qa-admin/admin-diagnostics.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))

          assert not missing, f'Missing rendered admin modules: {missing}'
          assert not dup, f'Duplicate DOM ids: {dup[:20]}'
          assert form is not None, 'Shared-password management form missing'
          assert not form.has_attr('hidden'), 'Shared-password management form must stay available in transition mode'
          assert report['shared_password_copy'], 'Shared-password transition copy missing'
          assert report['transition_copy'], 'Transition-mode explanation missing'

          print('ADMIN_DYNAMIC_MODULES=PASS')
          print('ADMIN_SHARED_PASSWORD_UI=PASS')
          PY

      - name: Capture mobile admin
        if: always()
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          if [ -n "$CHROME" ]; then
            mkdir -p qa-admin
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=7000 --screenshot=qa-admin/admin-mobile.png http://127.0.0.1:8080/admin.html || true
          fi
          cp /tmp/farbeyound-admin-http.log qa-admin/http.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-quality-gate
          path: qa-admin/
          retention-days: 3
