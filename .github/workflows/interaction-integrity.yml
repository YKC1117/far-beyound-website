name: Interaction and catalog integrity

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start preview
        run: |
          python3 -m http.server 8080 >/tmp/site.log 2>&1 &
          sleep 2
      - name: Verify rendered interactions
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          mkdir -p qa
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4800 --dump-dom http://127.0.0.1:8080/index.html > qa/home.html
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4800 --dump-dom http://127.0.0.1:8080/products.html > qa/products.html
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4800 --dump-dom 'http://127.0.0.1:8080/product.html?id=zebra-zt411-zt421' > qa/detail-rich.html
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4800 --dump-dom 'http://127.0.0.1:8080/product.html?id=software-bartender' > qa/detail-software.html
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4800 --dump-dom 'http://127.0.0.1:8080/product.html?id=not-a-real-product' > qa/detail-missing.html
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4800 --dump-dom 'http://127.0.0.1:8080/contact.html?item=Zebra%20ZT411' > qa/contact.html
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4800 --dump-dom http://127.0.0.1:8080/downloads.html > qa/downloads.html
          pip install --disable-pip-version-check beautifulsoup4 >/dev/null
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          from urllib.parse import urlparse, parse_qs, unquote
          import re

          def load(name): return BeautifulSoup(Path('qa',name+'.html').read_text(), 'html.parser')
          home=load('home'); products=load('products'); contact=load('contact'); downloads=load('downloads')
          rich=load('detail-rich'); software=load('detail-software'); missing=load('detail-missing')

          cards=products.select('#productGrid a.product-card')
          assert len(cards)>=151, f'Product catalog unexpectedly small: {len(cards)}'
          tokens=[]; problems=[]
          for card in cards:
              href=(card.get('href') or '').strip(); token=parse_qs(urlparse(href).query).get('id',[''])[0]
              if not token or token.startswith('legacy-'): problems.append(f'bad token: {token}')
              if token and not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*',token): problems.append(f'non-readable slug: {token}')
              img=card.select_one('img')
              if not img or not (img.get('src') or '').strip(): problems.append(f'missing image: {token}')
              else:
                  src=unquote((img.get('src') or '').split('?',1)[0].split('#',1)[0]).lstrip('/')
                  p=Path(src); minimum=200 if p.suffix.lower()=='.svg' else 2500
                  if not p.is_file() or p.stat().st_size<minimum: problems.append(f'invalid local image: {token} -> {src}')
              tokens.append(token)
          assert len(set(tokens))==len(cards), 'Product public slugs are not unique'
          assert not problems, '\n'.join(problems[:30])
          required={'software-bartender','software-codesoft','urovo-enterprise-mobile'}
          assert not required-set(tokens), f'Curated product entries missing: {sorted(required-set(tokens))}'

          brands=home.select('.brand-portfolio a.brand-wordmark')
          assert len(brands)==12, f'Expected 12 brand entries, got {len(brands)}'
          for a in brands:
              assert parse_qs(urlparse(a.get('href','')).query).get('brand'), f'Brand has no destination: {a.get_text(" ",strip=True)}'
              img=a.select_one('img.brand-logo-img, img.fb-own-brand-logo')
              assert img and img.get('src') and img.get('alt'), f'Brand has no logo: {a.get_text(" ",strip=True)}'

          nav_labels=[a.get_text(' ',strip=True).replace('⌄','').strip() for a in home.select('.desktop-nav > .nav-item > a')]
          assert nav_labels[:6]==['產品資訊','下載服務','系統方案','客戶案例','最新消息','聯絡我們'], nav_labels
          rail=home.select_one('.quick-contact'); mobile=home.select_one('.mobile-contact-bar')
          assert rail and mobile, 'Floating contact controls missing'
          expected_line='https://line.me/R/ti/p/@453haosc'
          assert expected_line in [a.get('href','') for a in rail.select('a')], 'Desktop LINE link missing'
          assert expected_line in [a.get('href','') for a in mobile.select('a')], 'Mobile LINE link missing'
          assert rail.select_one('[data-back-top] .quick-contact-btn'), 'Back-to-top button not integrated into right rail'
          assert not home.select_one('.back-top'), 'Legacy standalone back-to-top remains'

          assert rich.select_one('.product-detail-visual img'), 'Rich product image missing'
          assert 'ZT411' in (rich.select_one('#productHero h1').get_text(' ',strip=True) if rich.select_one('#productHero h1') else ''), 'ZT411 detail did not resolve'
          assert software.select_one('.product-detail-visual img[src*="software-bartender.svg"]'), 'BarTender local artwork did not resolve'
          assert software.select_one('.fb-official-resource'), 'BarTender official-resource action missing'
          assert missing.select_one('.product-not-found'), 'Invalid product URL should show not-found state'

          form=contact.select_one('#contactForm')
          assert form and form.get('method','').upper()=='POST', 'Contact form POST setup missing'
          for name in ['company','department','contact_name','phone','email','website']:
              assert form.select_one(f'[name="{name}"]'), f'Contact field missing name={name}'
          assert contact.select_one('#inquiryForm'), 'Inquiry fragment anchor missing'

          assert downloads.select_one('#downloadSearch'), 'Download search missing'
          assert downloads.select_one('#downloadTypeFilters'), 'Download type stage missing'
          assert downloads.select_one('#downloadBrandFilters'), 'Download brand stage missing'
          assert downloads.select_one('#downloadResults'), 'Download results missing'
          type_buttons=downloads.select('#downloadTypeFilters [data-type]')
          assert len(type_buttons)>=3, f'Download type filters unexpectedly sparse: {len(type_buttons)}'
          assert '先選擇下載類型' in downloads.get_text(' ',strip=True), 'Two-step download guidance missing'

          forbidden='測試版 正式版 原官網產品資料 新版目錄 網站提案 預覽環境 正式檔案空間'.split()
          public_text=' '.join([home.get_text(' ',strip=True),rich.get_text(' ',strip=True),software.get_text(' ',strip=True),contact.get_text(' ',strip=True),downloads.get_text(' ',strip=True)])
          leaked=[x for x in forbidden if x in public_text]
          assert not leaked, f'Public-facing internal wording leaked: {leaked}'

          print(f'PRODUCT_CARDS_OK={len(cards)}')
          print(f'UNIQUE_READABLE_PRODUCT_SLUGS={len(set(tokens))}')
          print('CURATED_SOFTWARE_UROVO=OK')
          print(f'LOCAL_PRODUCT_IMAGES_OK={len(cards)}')
          print('CLICKABLE_BRAND_ENTRIES_OK=12')
          print('FLOATING_CONTACT_DESKTOP=OK')
          print('FLOATING_CONTACT_MOBILE=OK')
          print('PRODUCT_DETAIL_BARTENDER=OK')
          print('CONTACT_FORM_FIELDS=OK')
          print(f'DOWNLOAD_TYPE_FILTERS={len(type_buttons)}')
          print('PUBLIC_COPY_CLEAN=OK')
          PY
