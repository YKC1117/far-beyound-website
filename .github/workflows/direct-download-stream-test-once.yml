name: Direct download stream test once
on:
  push:
    branches:
      - qa/direct-download-stream-test-20260917
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify real file bytes and attachment headers
        shell: bash
        run: |
          set -euo pipefail
          base='https://papqrnqbfauwuipjwwdh.supabase.co/functions/v1/download-file'
          src='https://www.argox.com/docfile/drivers/Argox_12.5.0.exe'
          encoded="$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$src")"
          curl -fsSL --max-time 30 -r 0-1023 -D headers.txt -o sample.bin "$base?name=Argox-Test&src=$encoded"
          test -s sample.bin
          grep -qi '^content-disposition: attachment;' headers.txt
          grep -qi '^content-type: application/' headers.txt
          echo "STREAM_OK bytes=$(wc -c < sample.bin)"
