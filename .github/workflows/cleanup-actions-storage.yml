name: One-time Actions artifact cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-actions-storage.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete old non-Pages artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '1 day ago' +%s)
          page=1
          deleted=0
          kept=0

          while true; do
            response=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}")

            count=$(jq '.artifacts | length' <<<"$response")
            if [ "$count" -eq 0 ]; then
              break
            fi

            while IFS=$'\t' read -r id name created_at; do
              [ -z "$id" ] && continue

              # GitHub Pages deployment artifacts are deliberately preserved.
              if [ "$name" = "github-pages" ] || [[ "$name" == *"pages"*"artifact"* ]]; then
                echo "KEEP Pages artifact: $name ($id)"
                kept=$((kept + 1))
                continue
              fi

              created_epoch=$(date -u -d "$created_at" +%s)
              if [ "$created_epoch" -ge "$cutoff" ]; then
                echo "KEEP recent artifact: $name ($id)"
                kept=$((kept + 1))
                continue
              fi

              curl -fsSL -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              echo "DELETED old artifact: $name ($id)"
              deleted=$((deleted + 1))
            done < <(jq -r '.artifacts[] | [.id, .name, .created_at] | @tsv' <<<"$response")

            page=$((page + 1))
          done

          echo "ARTIFACT_CLEANUP=PASS"
          echo "DELETED=$deleted"
          echo "KEPT=$kept"
