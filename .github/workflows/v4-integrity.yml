name: V4 presentation integrity

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start preview
        run: |
          python3 -m http.server 8080 >/tmp/site-v4.log 2>&1 &
          sleep 2
      - name: Verify V4 presentation layer
        run: |
          test -f assets/css/v4-polish.css
          test -f assets/css/v4-inner-polish.css
          test -f assets/js/v4-polish.js
          grep -q 'assets/css/v4-inner-polish.css' contact.html
          grep -q 'assets/js/v4-polish.js' contact.html
          grep -q 'assets/css/v4-inner-polish.css' product.html
          grep -q 'assets/js/v4-polish.js' solutions.html

          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          mkdir -p qa-v4
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4500 --dump-dom http://127.0.0.1:8080/contact.html > qa-v4/contact.html
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4500 --dump-dom http://127.0.0.1:8080/solutions.html > qa-v4/solutions.html
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4500 --dump-dom http://127.0.0.1:8080/downloads.html > qa-v4/downloads.html

          pip install --disable-pip-version-check beautifulsoup4 >/dev/null
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path

          def load(name):
              return BeautifulSoup(Path('qa-v4',name+'.html').read_text(), 'html.parser')

          contact=load('contact')
          solutions=load('solutions')
          downloads=load('downloads')

          maps=contact.select('#serviceLocations a.location-mini-action')
          assert len(maps)==2, f'Expected two service-location navigation links, got {len(maps)}'
          for link in maps:
              href=link.get('href','')
              assert href.startswith('https://www.google.com/maps/dir/'), href
              assert 'destination=' in href, href

          def active_label(doc):
              active=doc.select_one('.desktop-nav > .nav-item.current > a')
              return active.get_text(' ',strip=True).replace('⌄','').strip() if active else ''

          assert active_label(contact)=='公司資訊', f'Contact active nav wrong: {active_label(contact)}'
          assert active_label(solutions)=='系統方案', f'Solutions active nav wrong: {active_label(solutions)}'
          assert active_label(downloads)=='下載服務', f'Downloads active nav wrong: {active_label(downloads)}'

          assert contact.select_one('.contact-form'), 'Contact form missing'
          assert len(contact.select('#serviceLocations .location-mini'))==2, 'Service location cards missing'
          assert not contact.select_one('.back-top'), 'Legacy standalone back-top returned'
          assert contact.select_one('.quick-contact [data-back-top]'), 'Integrated TOP control missing'

          print('V4_FILES_WIRED=OK')
          print('V4_CONTACT_DIRECTIONS=2')
          print('V4_ACTIVE_NAV_CONTACT=COMPANY')
          print('V4_ACTIVE_NAV_SOLUTIONS=SOLUTIONS')
          print('V4_ACTIVE_NAV_DOWNLOADS=DOWNLOADS')
          print('V4_INTEGRATED_TOP=OK')
          PY
