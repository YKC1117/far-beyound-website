name: Offline demo source package

on:
  push:
    branches: [ offline-demo-package-20261005 ]
    paths:
      - '.github/workflows/source-backup.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact temporary branch
        uses: actions/checkout@v4
        with:
          ref: offline-demo-package-20261005
          fetch-depth: 1

      - name: Create exact website package
        run: |
          zip -r far-beyound-website-eb45a30b-offline-source.zip . -x '.git/*'

      - name: Upload exact source package
        uses: actions/upload-artifact@v4
        with:
          name: far-beyound-website-eb45a30b-offline-source
          path: far-beyound-website-eb45a30b-offline-source.zip
          retention-days: 7
