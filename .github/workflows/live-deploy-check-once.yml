name: Live deployment check once

on:
  push:
    branches:
      - qa/live-deploy-check-20260917

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify GitHub Pages has latest download fix
        shell: bash
        run: |
          set -euo pipefail
          url='https://ykc1117.github.io/far-beyound-website/downloads.html'
          for attempt in {1..20}; do
            body="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${url}?qa=${GITHUB_RUN_ID}-${attempt}" || true)"
            if grep -q 'downloads-redesign.js?v=20260917-0958' <<<"$body"; then
              echo "LIVE_OK attempt=$attempt"
              exit 0
            fi
            echo "Waiting for Pages deployment: attempt=$attempt"
            sleep 10
          done
          echo 'Latest download fix was not visible on GitHub Pages within the verification window.' >&2
          exit 1
