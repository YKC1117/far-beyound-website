name: Direct download gateway test once
on:
  push:
    branches:
      - qa/direct-download-gateway-test-20260917
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe direct download gateway
        shell: bash
        run: |
          set -euo pipefail
          base='https://papqrnqbfauwuipjwwdh.supabase.co/functions/v1/download-file'
          argox='https://www.argox.com/docfile/drivers/Argox_12.5.0.exe'
          encoded="$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$argox")"
          body="$(curl -fsSL --max-time 30 "$base?probe=1&name=Argox&src=$encoded")"
          echo "$body"
          grep -q '"ok":true' <<<"$body"
          bad="$(curl -sS --max-time 15 "$base?probe=1&name=Bad&src=https%3A%2F%2Fexample.com%2Fbad.exe")"
          grep -q 'source_not_allowed\|direct_file_pending' <<<"$bad"
