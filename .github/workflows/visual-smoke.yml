name: Visual smoke screenshots

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local preview server
        run: |
          python3 -m http.server 8080 >/tmp/farbeyound-http.log 2>&1 &
          sleep 2
      - name: Validate rendered catalog, images, brands and downloads
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          mkdir -p qa qa/brands
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4200 --dump-dom http://127.0.0.1:8080/products.html > qa/products.html
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4200 --dump-dom 'http://127.0.0.1:8080/products.html?category=printers' > qa/printers.html
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4200 --dump-dom 'http://127.0.0.1:8080/products.html?category=scanners' > qa/scanners.html
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4200 --dump-dom http://127.0.0.1:8080/downloads.html > qa/downloads.html
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4200 --dump-dom http://127.0.0.1:8080/index.html > qa/home.html
          i=0
          while IFS='|' read -r category brand; do
            i=$((i+1))
            encoded=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$brand")
            "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=3200 --dump-dom "http://127.0.0.1:8080/products.html?category=${category}&brand=${encoded}" > "qa/brands/${i}.html"
          done <<'EOF'
          printers|Zebra
          printers|Argox
          printers|TSC
          printers|GoDEX
          printers|TOSHIBA
          printers|SATO
          printers|Honeywell
          scanners|Fastech
          scanners|Zebra
          scanners|Honeywell
          scanners|NUMA
          scanners|Datalogic
          EOF
          pip install --disable-pip-version-check beautifulsoup4 >/dev/null
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          from urllib.parse import urlparse, parse_qs, unquote

          def soup(name): return BeautifulSoup(Path(f'qa/{name}.html').read_text(), 'html.parser')
          allp=soup('products'); printers=soup('printers'); scanners=soup('scanners'); downloads=soup('downloads'); home=soup('home')
          cards=allp.select('#productGrid .product-card')
          count_text=allp.select_one('#productCount').get_text(' ',strip=True) if allp.select_one('#productCount') else ''
          card_count=len(cards)
          assert card_count>=151, f'Catalog unexpectedly small: {card_count}'
          assert count_text.startswith(str(card_count)), f'Product count mismatch: {count_text!r} / {card_count}'

          tokens=[]; missing_links=[]; legacy=[]; missing_images=[]; invalid_images=[]; bad_alts=[]
          for i,card in enumerate(cards,1):
              href=(card.get('href') or '').strip()
              token=parse_qs(urlparse(href).query).get('id',[''])[0]
              if not token: missing_links.append(i)
              else:
                  tokens.append(token)
                  if token.startswith('legacy-'): legacy.append(token)
              img=card.select_one('img')
              if not img or not (img.get('src') or '').strip():
                  missing_images.append(token or str(i)); continue
              src=unquote((img.get('src') or '').split('?',1)[0].split('#',1)[0]).lstrip('/')
              if src.startswith(('http://','https://','data:')):
                  invalid_images.append(f'{token}: external image')
              else:
                  p=Path(src); minimum=200 if p.suffix.lower()=='.svg' else 2500
                  if not p.is_file() or p.stat().st_size<minimum: invalid_images.append(f'{token}: {src}')
              if not (img.get('alt') or '').strip(): bad_alts.append(token or str(i))
          assert not missing_links, f'Missing product links: {missing_links[:10]}'
          assert len(tokens)==card_count and len(set(tokens))==card_count, 'Product public slugs are not unique'
          assert not legacy, f'Legacy public ids exposed: {legacy[:10]}'
          assert not missing_images, f'Product cards missing images: {missing_images[:10]}'
          assert not invalid_images, f'Product image files missing/invalid: {invalid_images[:10]}'
          assert not bad_alts, f'Product images missing alt text: {bad_alts[:10]}'

          printer_brands=[x.get_text(' ',strip=True) for x in printers.select('#brandTabs .brand-chip')]
          scanner_brands=[x.get_text(' ',strip=True) for x in scanners.select('#brandTabs .brand-chip')]
          assert printer_brands==['全部品牌','Zebra','Argox','TSC','GoDEX','TOSHIBA','SATO','Honeywell'], printer_brands
          assert scanner_brands==['全部品牌','Fastech','Zebra','Honeywell','NUMA','Datalogic'], scanner_brands

          brand_links=home.select('.brand-portfolio a.brand-wordmark')
          assert len(brand_links)==12, f'Expected 12 homepage brand entries, got {len(brand_links)}'
          brand_values=[]
          for a in brand_links:
              href=(a.get('href') or '').strip(); brand=parse_qs(urlparse(href).query).get('brand',[''])[0]
              assert brand, f'Brand destination missing: {a.get_text(" ",strip=True)}'
              brand_values.append(brand)
              img=a.select_one('img.brand-logo-img, img.fb-own-brand-logo')
              assert img and img.get('src') and img.get('alt'), f'Brand logo missing: {brand}'
              src=unquote((img.get('src') or '').split('?',1)[0].split('#',1)[0]).lstrip('/')
              p=Path(src); minimum=200 if p.suffix.lower()=='.svg' else 2500
              assert p.is_file() and p.stat().st_size>=minimum, f'Invalid local brand logo: {src}'
          assert brand_values==['Zebra','Argox','TSC','GoDEX','TOSHIBA','SATO','Honeywell','Fastech','Zebra','Honeywell','NUMA','Datalogic'], brand_values

          empty=[]
          for p in sorted(Path('qa/brands').glob('*.html'),key=lambda x:int(x.stem)):
              if not BeautifulSoup(p.read_text(),'html.parser').select('#productGrid .product-card'): empty.append(p.stem)
          assert not empty, f'Brand destinations with no products: {empty}'

          type_buttons=downloads.select('#downloadTypeFilters [data-type]')
          assert len(type_buttons)>=3, f'Download types missing: {len(type_buttons)}'
          assert downloads.select_one('#downloadSearch'), 'Download search missing'
          assert downloads.select_one('#downloadResults'), 'Download results missing'
          assert '先選擇下載類型' in downloads.get_text(' ',strip=True), 'Two-step download guidance missing'
          assert home.select_one('.header-inner .brand-reg'), 'Registered mark missing in header'

          print(f'CATALOG_CARD_COUNT={card_count}')
          print(f'LOCAL_PRODUCT_IMAGES={card_count}')
          print(f'UNIQUE_PRODUCT_URL_TOKENS={len(set(tokens))}')
          print('CLICKABLE_BRAND_LOGOS=12')
          print('NONEMPTY_BRAND_DESTINATIONS=12')
          print(f'DOWNLOAD_TYPE_BUTTONS={len(type_buttons)}')
          PY
      - name: Capture desktop pages
        run: |
          mkdir -p screenshots
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          for spec in 'home|index.html' 'products|products.html' 'downloads|downloads.html' 'contact|contact.html'; do
            name=${spec%%|*}; path=${spec#*|}
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1100 --virtual-time-budget=3200 --screenshot="screenshots/$name.png" "http://127.0.0.1:8080/$path"
          done
      - name: Capture mobile pages
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=3200 --screenshot=screenshots/mobile-home.png http://127.0.0.1:8080/index.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=3200 --screenshot=screenshots/mobile-products.png http://127.0.0.1:8080/products.html
      - uses: actions/upload-artifact@v4
        with:
          name: website-screenshots
          path: screenshots/
          retention-days: 3
