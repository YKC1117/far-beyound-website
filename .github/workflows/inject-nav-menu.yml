name: Inject enhanced navigation

on:
  push:
    paths:
      - 'assets/js/nav-menu.js'
      - 'assets/js/presentation-polish.js'
      - 'assets/js/final-fixes.js'
      - 'assets/js/v2-corporate.js'
      - 'assets/js/v4-polish.js'
      - 'assets/js/v5-showcase.js'
      - 'assets/css/v2-corporate.css'
      - 'assets/css/v4-polish.css'
      - 'assets/css/v4-inner-polish.css'
      - 'assets/css/v5-showcase.css'
      - '.github/workflows/inject-nav-menu.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add public presentation scripts favicon and V5 stylesheets
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]
          for p in Path('.').glob('*.html'):
              if p.name in {'admin.html'}:
                  continue
              text=p.read_text(encoding='utf-8')
              original=text
              if 'assets/js/app.js' not in text:
                  continue
              if 'assets/css/v2-corporate.css' not in text:
                  text=text.replace('</head>', '<link rel="stylesheet" href="assets/css/v2-corporate.css"></head>')
              if 'assets/css/v4-polish.css' not in text:
                  marker='<link rel="stylesheet" href="assets/css/v3-refinement.css">'
                  if marker in text:
                      text=text.replace(marker, marker+'<link rel="stylesheet" href="assets/css/v4-polish.css">')
                  else:
                      text=text.replace('</head>', '<link rel="stylesheet" href="assets/css/v4-polish.css"></head>')
              if 'assets/css/v4-inner-polish.css' not in text:
                  marker='<link rel="stylesheet" href="assets/css/v4-polish.css">'
                  if marker in text:
                      text=text.replace(marker, marker+'<link rel="stylesheet" href="assets/css/v4-inner-polish.css">')
                  else:
                      text=text.replace('</head>', '<link rel="stylesheet" href="assets/css/v4-inner-polish.css"></head>')
              if 'assets/css/v5-showcase.css' not in text:
                  marker='<link rel="stylesheet" href="assets/css/v4-inner-polish.css">'
                  if marker in text:
                      text=text.replace(marker, marker+'<link rel="stylesheet" href="assets/css/v5-showcase.css">')
                  else:
                      text=text.replace('</head>', '<link rel="stylesheet" href="assets/css/v5-showcase.css"></head>')
              for script in ['assets/js/nav-menu.js','assets/js/presentation-polish.js','assets/js/final-fixes.js','assets/js/v2-corporate.js','assets/js/v4-polish.js','assets/js/v5-showcase.js']:
                  if script not in text:
                      text=text.replace('</body>', f'<script src="{script}"></script></body>')
              if 'rel="icon"' not in text:
                  text=text.replace('</head>', '<link rel="icon" type="image/png" href="assets/images/brand/far-beyound-logo.png"></head>')
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed.append(p.name)
          print('updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit HTML wiring
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Apply V5 showcase layer across public pages'
          git push
