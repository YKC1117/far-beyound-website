name: Inject enhanced navigation

on:
  push:
    paths:
      - 'assets/js/nav-menu.js'
      - 'assets/js/presentation-polish.js'
      - '.github/workflows/inject-nav-menu.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add public presentation scripts and favicon
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]
          for p in Path('.').glob('*.html'):
              if p.name in {'admin.html'}:
                  continue
              text=p.read_text(encoding='utf-8')
              original=text
              if 'assets/js/app.js' not in text:
                  continue
              if 'assets/js/nav-menu.js' not in text:
                  text=text.replace('</body>', '<script src="assets/js/nav-menu.js"></script></body>')
              if 'assets/js/presentation-polish.js' not in text:
                  text=text.replace('</body>', '<script src="assets/js/presentation-polish.js"></script></body>')
              if 'rel="icon"' not in text:
                  text=text.replace('</head>', '<link rel="icon" type="image/png" href="assets/images/brand/far-beyound-logo.png"></head>')
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed.append(p.name)
          print('updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit HTML wiring
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Load polished presentation on public pages'
          git push
