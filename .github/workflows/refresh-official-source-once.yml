name: Refresh official source once

on:
  push:
    branches:
      - migration/official-site-direct-20260917
    paths:
      - tools/import_legacy_catalog.py
      - tools/import_legacy_downloads.py
      - tools/import_legacy_news.py
      - .github/workflows/refresh-official-source-once.yml

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/official-site-direct-20260917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Refresh products from current company website
        run: python tools/import_legacy_catalog.py
      - name: Refresh downloads from current company website
        run: python tools/import_legacy_downloads.py
      - name: Refresh news from current company website
        run: python tools/import_legacy_news.py
      - name: Validate generated source data
        run: |
          grep -q 'window.FBLegacyCatalog' assets/js/legacy-catalog.js
          grep -q 'window.FBLegacyDownloads' assets/js/legacy-downloads.js
          grep -q 'window.FBLegacyNews' assets/js/legacy-news.js
          test $(find assets/images/catalog -type f | wc -l) -gt 100
      - name: Commit refreshed official source snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/legacy-catalog.js assets/js/legacy-downloads.js assets/js/legacy-news.js assets/images/catalog
          if git diff --cached --quiet; then
            echo 'Official source snapshot already current.'
          else
            git commit -m 'Refresh official website source snapshot [skip ci]'
            git push origin HEAD:migration/official-site-direct-20260917
          fi
