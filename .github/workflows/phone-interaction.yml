name: Desktop phone interaction

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/final-fixes.js'
      - 'assets/js/contact-youtube-upgrade.js'
      - '*.html'
      - '.github/workflows/phone-interaction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-click:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start local preview
        run: |
          python3 -m http.server 8080 >/tmp/fb-phone.log 2>&1 &
          sleep 2

      - name: Install Selenium
        run: pip install --disable-pip-version-check selenium >/dev/null

      - name: Click desktop phone and verify panel
        run: |
          python3 - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          options = webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-gpu')
          options.add_argument('--window-size=1440,1000')

          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 15)
          try:
              driver.get('http://127.0.0.1:8080/index.html')
              button = wait.until(EC.element_to_be_clickable((By.CSS_SELECTOR, '.quick-contact-item[data-contact-phone] .quick-contact-btn')))

              button.click()
              wait.until(lambda d: button.get_attribute('aria-expanded') == 'true')

              panel = wait.until(EC.visibility_of_element_located((By.CSS_SELECTOR, '.quick-contact-item[data-contact-phone] .quick-phone-panel')))
              links = panel.find_elements(By.CSS_SELECTOR, 'a.quick-phone-link[href^="tel:"]')
              hrefs = [a.get_attribute('href') for a in links]
              labels = [a.text for a in links]

              assert len(links) == 2, f'Expected 2 phone links, got {len(links)}'
              assert any('0282217759' in h for h in hrefs), hrefs
              assert any('062360139' in h for h in hrefs), hrefs
              assert any('新北辦公室' in t and '02-82217759' in t for t in labels), labels
              assert any('台南辦公室' in t and '06-2360139' in t for t in labels), labels
              assert all(a.is_displayed() for a in links), 'Phone links are present but not visible'

              button.click()
              wait.until(lambda d: button.get_attribute('aria-expanded') == 'false')
              print('DESKTOP PHONE INTERACTION PASSED')
          finally:
              driver.quit()
          PY
