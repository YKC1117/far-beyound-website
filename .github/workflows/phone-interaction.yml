name: Desktop phone interaction

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/final-fixes.js'
      - 'assets/js/contact-youtube-upgrade.js'
      - 'assets/js/desktop-phone-popover.js'
      - '*.html'
      - '.github/workflows/phone-interaction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-click:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start local preview
        run: |
          python3 -m http.server 8080 >/tmp/fb-phone.log 2>&1 &
          sleep 2

      - name: Install Selenium
        run: pip install --disable-pip-version-check selenium >/dev/null

      - name: Click desktop phone and verify panel
        run: |
          python3 - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.common.exceptions import StaleElementReferenceException

          BUTTON = '.quick-contact-item[data-contact-phone] .quick-contact-btn'
          POPOVER = '#fbDesktopPhonePopover'

          options = webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-gpu')
          options.add_argument('--window-size=1440,1000')

          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 15)

          def get_button():
              return wait.until(EC.element_to_be_clickable((By.CSS_SELECTOR, BUTTON)))

          def get_popover():
              return wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, POPOVER)))

          def click_fresh():
              last_error = None
              for _ in range(6):
                  try:
                      button = get_button()
                      button.click()
                      return
                  except StaleElementReferenceException as exc:
                      last_error = exc
                      time.sleep(0.15)
              raise last_error

          def button_attr(name):
              try:
                  return driver.find_element(By.CSS_SELECTOR, BUTTON).get_attribute(name)
              except StaleElementReferenceException:
                  return None

          def popover_attr(name):
              try:
                  return driver.find_element(By.CSS_SELECTOR, POPOVER).get_attribute(name)
              except StaleElementReferenceException:
                  return None

          try:
              driver.get('http://127.0.0.1:8080/index.html')
              get_button()
              get_popover()

              # 舊版腳本可能在首頁載入初期重建一次快速聯絡列；重新取 DOM 後再操作。
              time.sleep(0.35)

              click_fresh()
              wait.until(lambda d: button_attr('aria-expanded') == 'true')
              wait.until(lambda d: popover_attr('aria-hidden') == 'false')
              wait.until(EC.visibility_of_element_located((By.CSS_SELECTOR, POPOVER)))

              popover = get_popover()
              links = popover.find_elements(By.CSS_SELECTOR, 'a[href^="tel:"]')
              hrefs = [a.get_attribute('href') for a in links]
              labels = [a.text for a in links]

              assert len(links) == 2, f'Expected 2 phone links, got {len(links)}'
              assert any('0282217759' in h for h in hrefs), hrefs
              assert any('062360139' in h for h in hrefs), hrefs
              assert any('新北辦公室' in t and '02-82217759' in t for t in labels), labels
              assert any('台南辦公室' in t and '06-2360139' in t for t in labels), labels
              assert all(a.is_displayed() for a in links), 'Phone links are present but not visible'

              click_fresh()
              wait.until(lambda d: button_attr('aria-expanded') == 'false')
              wait.until(lambda d: popover_attr('aria-hidden') == 'true')
              print('DESKTOP PHONE INTERACTION PASSED')
          finally:
              driver.quit()
          PY
