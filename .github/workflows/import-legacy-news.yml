name: Import official news

on:
  push:
    paths:
      - 'tools/import_legacy_news.py'
      - '.github/workflows/import-legacy-news.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'

permissions:
  contents: write

concurrency:
  group: official-news-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-news:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install importer dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Crawl current company news archive
        run: python tools/import_legacy_news.py
      - name: Validate imported archive
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          raw=Path('assets/js/legacy-news.js').read_text(encoding='utf-8').strip();prefix='window.FBLegacyNews='
          if not raw.startswith(prefix) or not raw.endswith(';'):raise SystemExit('Invalid legacy-news.js wrapper')
          data=json.loads(raw[len(prefix):-1]);items=data.get('items') or []
          if len(items)<10:raise SystemExit(f'Only {len(items)} imported articles')
          ids=[str(x.get('id') or '') for x in items];paths=[str(x.get('legacyPath') or '') for x in items]
          if any(not x for x in ids) or len(ids)!=len(set(ids)):raise SystemExit('Missing or duplicate article id')
          if any(not re.fullmatch(r'/news/\d+/\d+',x) for x in paths) or len(paths)!=len(set(paths)):raise SystemExit('Missing, duplicate or unexpected legacy path')
          if 'far-beyound.com.tw' in raw.lower():raise SystemExit('Public official archive must not depend on the old hostname')
          for item in items:
              if not item.get('title') or not isinstance(item.get('body'),list):raise SystemExit('Invalid article content shape')
              joined='\n'.join(str(x) for x in item['body']).lower()
              if '<script' in joined or '<iframe' in joined or 'javascript:' in joined:raise SystemExit(f'Unsafe article content: {item["id"]}')
          print(f'OFFICIAL_NEWS_COUNT={len(items)}');print(f'OFFICIAL_NEWS_WITH_BODY={sum(bool(x.get("body")) for x in items)}');print('OFFICIAL_NEWS_VALIDATION=PASS')
          PY
      - name: Commit imported archive
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/js/legacy-news.js
          if git diff --cached --quiet; then
            echo 'Official news archive already current.'
          else
            git commit -m 'Sync official news archive [skip ci]'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
