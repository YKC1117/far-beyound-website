name: Cleanup Actions storage now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-actions-storage-now.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete all Actions artifacts and caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          deleted_artifacts=0
          while true; do
            response=$(curl -fsSL "${headers[@]}" "${api}/actions/artifacts?per_page=100&page=1")
            count=$(jq '.artifacts | length' <<<"$response")
            [ "$count" -eq 0 ] && break
            while read -r id; do
              [ -z "$id" ] && continue
              curl -fsSL -X DELETE "${headers[@]}" "${api}/actions/artifacts/${id}"
              deleted_artifacts=$((deleted_artifacts + 1))
            done < <(jq -r '.artifacts[].id' <<<"$response")
          done

          deleted_caches=0
          while true; do
            response=$(curl -fsSL "${headers[@]}" "${api}/actions/caches?per_page=100&page=1")
            count=$(jq '.actions_caches | length' <<<"$response")
            [ "$count" -eq 0 ] && break
            while read -r id; do
              [ -z "$id" ] && continue
              curl -fsSL -X DELETE "${headers[@]}" "${api}/actions/caches/${id}"
              deleted_caches=$((deleted_caches + 1))
            done < <(jq -r '.actions_caches[].id' <<<"$response")
          done

          echo "DELETED_ARTIFACTS=${deleted_artifacts}"
          echo "DELETED_CACHES=${deleted_caches}"
          echo "CLEANUP=PASS"
