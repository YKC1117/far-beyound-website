name: Optimize product images

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/optimize_product_images.py'
      - '.github/workflows/optimize-product-images.yml'

permissions:
  contents: write

jobs:
  optimize-images:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pngquant
          python -m pip install --disable-pip-version-check pillow

      - name: Optimize catalog and product images
        run: python tools/optimize_product_images.py | tee /tmp/image-optimization.txt

      - name: Commit optimized images to PR branch
        shell: bash
        run: |
          if git diff --quiet -- assets/images/catalog assets/images/products; then
            echo "Images already optimized."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/images/catalog assets/images/products
          git commit -m 'Optimize catalog and product images'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
