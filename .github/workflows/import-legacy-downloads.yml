name: Import legacy official downloads

on:
  push:
    paths:
      - 'tools/import_legacy_downloads.py'
      - '.github/workflows/import-legacy-downloads.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-download-import
  cancel-in-progress: true

jobs:
  import-downloads:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install importer dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Crawl current official download pages
        run: python tools/import_legacy_downloads.py
      - name: Commit generated download links
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/legacy-downloads.js
          if git diff --cached --quiet; then
            echo 'Download data already current.'
          else
            git commit -m 'Sync downloads from current official website'
            git pull --rebase origin main
            git push origin main
          fi
