name: Direct download patch once

on:
  push:
    branches:
      - feat/direct-download-library-20260917-v3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/direct-download-library-20260917-v3
      - name: Patch download center to keep customers on direct downloads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('assets/js/downloads-redesign.js')
          s=p.read_text(encoding='utf-8')
          replacement=r'''  const DOWNLOAD_GATEWAY='https://papqrnqbfauwuipjwwdh.supabase.co/functions/v1/download-file';
          const DIRECT_FILE=/\.(?:zip|exe|msi|dmg|pkg|pdf|rar|7z|gz|tgz|tar)(?:$|[?#])/i;
          const SPECIAL_DIRECT=[/^https:\/\/fs\.tscprinters\.com\/(?:[^/]+\/)?dl\/\d+\/\d+(?:[?#]|$)/i,/^https:\/\/download\.anydesk\.com\//i];
          function safeDownload(item){
            const url=String(item.url||'').trim();
            if(!url)return {href:`contact.html?item=${encodeURIComponent(item.name||'下載資料')}`,action:'洽詢取得',external:false};
            const signed=/[?&](?:Policy|Signature|Key-Pair-Id|Expires)=/i.test(url);
            const direct=!signed&&(DIRECT_FILE.test(url)||SPECIAL_DIRECT.some(re=>re.test(url)));
            if(direct){
              const sp=new URLSearchParams({src:url,name:String(item.name||'download')});
              return {href:`${DOWNLOAD_GATEWAY}?${sp.toString()}`,action:'直接下載',external:false};
            }
            return {href:`contact.html?item=${encodeURIComponent((item.name||'下載資料')+' 檔案索取')}`,action:'洽詢取得',external:false};
          }
'''
          s2,n=re.subn(r"  function safeDownload\(item\)\{.*?\n  \}\n(?=  function init\(\)\{)",replacement,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'safeDownload replacement count={n}')
          if '前往官方下載' in s2:
              raise SystemExit('external redirect label still present')
          if "action:'直接下載'" not in s2 or 'DOWNLOAD_GATEWAY' not in s2:
              raise SystemExit('direct download gateway patch missing')
          p.write_text(s2,encoding='utf-8')
          PY
          node --check assets/js/downloads-redesign.js
          grep -q "直接下載" assets/js/downloads-redesign.js
          ! grep -q "前往官方下載" assets/js/downloads-redesign.js
      - name: Remove one-time workflow
        run: rm .github/workflows/direct-download-patch-once.yml
      - name: Commit patch only
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/downloads-redesign.js .github/workflows/direct-download-patch-once.yml
          git commit -m "Route downloads through direct download gateway"
          git push origin HEAD:feat/direct-download-library-20260917-v3
