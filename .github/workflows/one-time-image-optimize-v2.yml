name: One-time image optimize v2

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/optimize_product_images_v2.py'
      - '.github/workflows/one-time-image-optimize-v2.yml'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Optimize with real-format and alpha audit
        run: python tools/optimize_product_images_v2.py | tee /tmp/image-v2.txt
      - name: Commit optimized assets
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Optimize images preserving actual format and alpha'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
