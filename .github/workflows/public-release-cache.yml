name: Public release cache sync

on:
  push:
    paths:
      - 'tools/bump_public_release.py'
      - '.github/workflows/public-release-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-release-cache
  cancel-in-progress: true

jobs:
  sync-public-cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update public release loader versions
        run: python tools/bump_public_release.py
      - name: Commit changed HTML files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo 'Public release cache versions already current.'
          else
            git commit -m 'Sync public release cache version 2026-09-12 16:54'
            git pull --rebase origin main
            git push origin main
          fi
