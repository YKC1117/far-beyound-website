<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>網站管理 Demo｜萬里資訊</title><link rel="stylesheet" href="assets/css/app.css"></head><body data-page="admin"><div class="admin-shell"><aside class="admin-side"><a href="index.html" class="brand brand-light"><span class="brand-mark"><i></i><i></i><i></i></span><span class="brand-copy"><strong>萬里資訊</strong><small>WEB ADMIN</small></span></a><nav class="admin-nav"><a class="active" href="#">儀表板</a><a href="#products">產品管理</a><a href="downloads.html">下載中心預覽</a><a href="solutions.html">系統方案預覽</a><a href="news.html">最新消息預覽</a><a href="index.html">返回網站前台</a></nav><div class="admin-mode"><b>GitHub Pages 測試模式</b><br>目前變更只儲存在這台裝置的瀏覽器，可匯出 JSON。正式版將改接 MySQL + 登入權限。</div></aside><main class="admin-main"><div class="admin-top"><div><h1>網站管理儀表板</h1><p>這不是假按鈕：產品新增、修改、刪除與 JSON 匯入／匯出都可以實際操作。</p></div><div class="admin-actions"><a class="btn btn-secondary btn-sm" href="index.html" target="_blank">開啟前台</a><button id="exportBtn" class="btn btn-secondary btn-sm">匯出 JSON</button><label class="btn btn-secondary btn-sm">匯入 JSON<input id="importInput" class="hidden-input" type="file" accept="application/json"></label><button id="resetBtn" class="btn btn-secondary btn-sm">恢復測試資料</button></div></div><section id="adminStats" class="admin-stats"></section><section id="products" class="admin-panel"><div class="admin-panel-head"><div><span class="eyebrow">PRODUCT MANAGEMENT</span><h2>產品管理</h2></div><button id="newProductBtn" class="btn btn-primary btn-sm">＋ 新增產品</button></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>品牌</th><th>產品</th><th>分類</th><th>狀態</th><th>操作</th></tr></thead><tbody id="adminProductRows"></tbody></table></div></section></main></div><div id="adminFormPanel" class="admin-form-overlay"><div class="admin-form-drawer"><div class="admin-form-head"><h2 id="formTitle">新增產品</h2><button id="adminFormClose" class="icon-btn" type=
