<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聯絡我們｜萬里資訊</title><link rel="stylesheet" href="assets/css/app.css"></head><body data-page="contact"><div id="siteHeader"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">CONTACT US</span><h1>聯絡我們</h1><p>設備詢價、耗材需求、系統導入與技術服務，歡迎留下需求資訊。</p></div></section><section class="section"><div class="container contact-grid"><div class="contact-copy"><span class="eyebrow">SERVICE CONTACT</span><h2>告訴我們您的需求</h2><p>正式版可把表單直接寄到指定信箱，或寫入網站後台供業務與客服追蹤。GitHub 測試版目前只驗證欄位與流程，不會送出資料。</p><div id="contactCards" class="contact-cards"></div></div><form id="contactForm" class="contact-form"><div class="form-grid"><div class="field"><label>服務單位 *</label><input required placeholder="公司／單位名稱"></div><div class="field"><label>部門 *</label><input required placeholder="部門名稱"></div><div class="field"><label>姓名 *</label><input required placeholder="聯絡人姓名"></div><div class="field"><label>電話 *</label><input required inputmode="tel" placeholder="電話／分機"></div><div class="field full"><label>E-mail *</label><input required type="email" placeholder="name@company.com"></div><div class="field full"><label>洽詢項目</label><input id="subject" placeholder="例如 Zebra ZT411、標籤耗材、WMS"></div><div class="field full"><label>需求說明</label><textarea placeholder="請描述設備型號、使用情境、數量或目前遇到的問題"></textarea></div></div><p class="form-note">＊此為新版官網測試環境，送出不會傳送任何資料。</p><button class="btn btn-primary" type="submit">送出測試表單</button><div id="formSuccess" class="form-success">表單欄位驗證成功。正式版接入郵件／資料庫後即可成為真正詢問單。</div></form></div></section></main><div id="siteFooter"></div><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script src="assets/js/pages.js"></script></body></html>
