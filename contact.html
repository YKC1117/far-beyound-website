<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聯絡我們｜萬里資訊</title><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/v2-corporate.css"><link rel="stylesheet" href="assets/css/v3-refinement.css"><style>.budget-options{display:flex;flex-wrap:wrap;gap:8px}.budget-options label{display:flex;align-items:center;gap:7px;border:1px solid var(--line);padding:7px 10px;background:#fff;font-size:11px;font-weight:500;cursor:pointer}.budget-options input{accent-color:var(--teal)}.form-section-label{grid-column:1/-1;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--teal);margin-top:4px}.contact-form{position:relative}.inquiry-anchor{position:absolute;top:-118px;left:0;width:1px;height:1px;pointer-events:none;visibility:hidden}</style><link rel="icon" type="image/png" href="assets/images/brand/far-beyound-logo.png"></head><body data-page="contact"><div id="siteHeader"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">CONTACT US</span><h1>聯絡我們</h1><p>設備詢價、耗材需求、系統導入與技術服務，歡迎留下需求資訊。</p></div></section><section class="section"><div class="container contact-grid"><div class="contact-copy"><span class="eyebrow">SERVICE CONTACT</span><h2>告訴我們您的需求</h2><p>請提供聯絡方式與需求內容，我們將依產品、耗材、維修或系統項目協助確認後續方向。</p><div id="contactCards" class="contact-cards"></div></div><form id="contactForm" class="contact-form"><span id="inquiryForm" class="inquiry-anchor" aria-hidden="true"></span><div class="form-grid"><div class="form-section-label">聯絡資料</div><div class="field"><label>服務單位 *</label><input required placeholder="公司／單位名稱"></div><div class="field"><label>部門 *</label><input required placeholder="部門名稱"></div><div class="field"><label>姓名 *</label><input required placeholder="聯絡人姓名"></div><div class="field"><label>職稱</label><input placeholder="職稱"></div><div class="field"><label>電話 *</label><input required inputmode="tel" placeholder="公司電話"></div><div class="field"><label>分機</label><input inputmode="numeric" placeholder="分機"></div><div class="field"><label>手機號碼</label><input inputmode="tel" placeholder="09xx-xxx-xxx"></div><div class="field"><label>E-mail *</label><input required type="email" placeholder="name@company.com"></div><div class="form-section-label">需求內容</div><div class="field full"><label>洽詢項目</label><select id="subject"><option value="">請選擇洽詢項目</option><option>標籤條碼列印機</option><option>條碼掃描器</option><option>RFID 設備</option><option>行動電腦</option><option>標籤貼紙與碳帶</option><option>標籤貼紙代印</option><option>標籤軟體</option><option>標籤機維修／配件</option><option>SFIS／WMS／SMT 系統方案</option><option>其他需求</option></select></div><div class="field full"><label>預算範圍</label><div class="budget-options"><label><input type="radio" name="budget" value="10萬以下">10萬以下</label><label><input type="radio" name="budget" value="10~30萬">10～30萬</label><label><input type="radio" name="budget" value="30~50萬">30～50萬</label><label><input type="radio" name="budget" value="50萬以上">50萬以上</label></div></div><div class="field full"><label>需求說明</label><textarea placeholder="請描述設備型號、使用情境、數量、標籤尺寸或目前遇到的問題"></textarea></div></div><p class="form-note">請確認聯絡資料與需求內容後送出。</p><button class="btn btn-primary" type="submit">送出詢問</button><div id="formSuccess" class="form-success">感謝您的詢問，我們將依您提供的資料協助確認後續。</div></form></div></section></main><div id="siteFooter"></div><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script src="assets/js/pages.js"></script><script src="assets/js/media-patch.js"></script><script src="assets/js/legacy-catalog.js"></script><script src="assets/js/catalog-merge.js"></script><script src="assets/js/nav-menu.js"></script><script src="assets/js/catalog-ui.js"></script><script src="assets/js/presentation-polish.js"></script><script src="assets/js/final-fixes.js"></script><script src="assets/js/v2-corporate.js"></script><script src="assets/js/v3-refinement.js"></script></body></html>
